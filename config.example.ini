[Historian]
Server=APP
ConnectionTimeoutSeconds=30
TestTag=TI-xxxx

[Events]
Server=EVENTJOURNAL
Database=EventJournal
Schema=dbo
Table=Journal
CommandTimeoutSeconds=30

[Api]
Bind=127.0.0.1
Port=18080
ApiKey=CHANGE_ME

[ApiLimits]
MaxTagsPerRequest=50
MaxEventRows=5000
MaxRequestBytes=1048576
MaxHistorySpanHours=24
MaxSamplesPerRead=10000
RequestTimeoutSeconds=60

[Time]
SourceTimeZone=China Standard Time

[Files]
Logs=logs
